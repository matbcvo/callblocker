name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # Provides Gradle itself plus dependency/build caching. The pinned version
      # matches gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The wrapper JAR is not in the repo (it is a binary). Once you commit one,
      # this automatically switches to it so CI and local builds stay identical.
      - name: Build debug APK and release bundle
        run: |
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          "$GRADLE" assembleDebug bundleRelease --stacktrace

      # Installable on a device as-is; signed with the standard debug key.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callblocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Compile check only — unsigned, so Play will not accept this one.
      # Tag a release to get a signed bundle (see release.yml).
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: callblocker-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    # Informational: a lint regression should not block a build that compiles.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run lint
        run: |
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          "$GRADLE" lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
