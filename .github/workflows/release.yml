name: Release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # Gradle itself comes from the committed wrapper; this action only provides
      # dependency and build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fail loudly rather than quietly emitting an unsigned bundle that Play rejects.
      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See README for generating an upload key."
            exit 1
          fi

      # The secrets context is not available in a step-level `if:`, so the presence of
      # the Play credentials is recorded as a step output instead.
      - name: Check for Play credentials
        id: play_credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'No Play service account configured; the upload step will be skipped.'
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # run_number is monotonic per repository, which is exactly what Play
          # requires of versionCode.
          VERSION_CODE: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Play wants "1.0.0", not the tag's "v1.0.0".
          if [ "$REF_TYPE" = "tag" ]; then
            export VERSION_NAME="${REF_NAME#v}"
          else
            export VERSION_NAME="0.0.0-dev"
          fi
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: callblocker-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The APK is attached for sideloading; Play only accepts the .aab.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      # Skipped automatically until the Play service account secret exists, so the
      # rest of the release still works before the Play listing is set up.
      - name: Upload to Google Play (internal testing)
        if: github.ref_type == 'tag' && steps.play_credentials.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ee.prica.callblocker
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
